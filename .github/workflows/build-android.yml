name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          npm ci
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: Build Web Production Assets
        run: npm run build

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init QuickStatus com.quickstatus.app --web-dir dist
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Force Java 17 Compatibility
        run: |
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }' android/app/build.gradle

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --warning-mode all

      - name: Build Android Release APK & AAB Bundle
        working-directory: android
        run: |
          ./gradlew assembleRelease --warning-mode all
          ./gradlew bundleRelease --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickStatus-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK & AAB
        uses: actions/upload-artifact@v4
        with:
          name: QuickStatus-Android-Bundles
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/bundle/
