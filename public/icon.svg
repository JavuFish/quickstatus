<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#27272a" stroke-width="4"/>
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="url(#cyanGradient)" opacity="0.15"/>
  
  <!-- Camera Body -->
  <rect x="136" y="180" width="240" height="180" rx="36" fill="#18181b" stroke="url(#cyanGradient)" stroke-width="14"/>
  
  <!-- Camera Top Notch -->
  <path d="M196 180 L216 140 L296 140 L316 180 Z" fill="#27272a" stroke="url(#cyanGradient)" stroke-width="12"/>
  
  <!-- Lens Rings -->
  <circle cx="256" cy="270" r="54" fill="#09090b" stroke="url(#cyanGradient)" stroke-width="12"/>
  <circle cx="256" cy="270" r="28" fill="url(#cyanGradient)"/>
  
  <!-- Lens Highlight -->
  <circle cx="244" cy="258" r="8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Lightning Zap Badge on Top Right -->
  <g transform="translate(320, 120)">
    <circle cx="36" cy="36" r="44" fill="#22d3ee"/>
    <path d="M38 12 L20 40 L34 40 L28 62 L52 32 L38 32 Z" fill="#09090b"/>
  </g>
</svg>
